<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MANGO Account</title><link rel="stylesheet" href="style.css"></head><body><main class="hero"><div><span class="pill">ACCOUNT</span><h1>YOUR<br><em>MANGO.</em></h1><p id="status">Supabase bağlantısını config.js içine ekle.</p><input id="email" placeholder="E-mail" style="padding:14px;width:280px;background:#111;border:1px solid #333;color:white;border-radius:10px"><br><button id="login" style="margin-top:12px;padding:14px 20px;border:0;border-radius:10px;background:#ffc928">Magic link gönder</button></div></main><script src="config.js"></script><script>document.querySelector('#login').onclick=async()=>{if(!MANGO_CONFIG.supabaseUrl){status.textContent='Önce Supabase URL + publishable key ekle knk.';return}status.textContent='Supabase client burada bağlanacak.'};</script></body></html>
